# =============================================================================
# DevAcademy - proxy reverso Nginx
#
#   /api/*  -> backend  (API Express)
#   /       -> frontend (Next.js)
#
# É o único container que publica uma porta para o host.
# =============================================================================

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------
    # As requisições de API são encaminhadas ao container do backend.
    # O prefixo /api é preservado porque o proxy_pass não tem parte de URI.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # Qualquer outra requisição vai para o servidor Next.js.
    # Os cabeçalhos de upgrade mantêm funcionando recursos baseados em WebSocket.
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
