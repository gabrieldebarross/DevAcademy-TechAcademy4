# =============================================================================
# DevAcademy - Nginx reverse proxy
#
#   /api/*  -> backend  (Express API)
#   /       -> frontend (Next.js)
#
# This is the only container that publishes a port to the host.
# =============================================================================

server {
    listen 80;
    server_name _;

    # ---------------------------------------------------------------------
    # API requests are forwarded to the backend container.
    # The /api prefix is preserved because proxy_pass has no URI part.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # Every other request goes to the Next.js server.
    # Upgrade headers keep WebSocket based features working.
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
