# =============================================================================
# DevAcademy - production environment for a cloud VM
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Same topology as docker-compose.yml (nginx -> frontend/backend -> mysql),
# with the differences a real server needs:
#   * required secrets (no insecure fallbacks): MYSQL_ROOT_PASSWORD,
#     MYSQL_PASSWORD and JWT_SECRET must be set in the `.env` file
#   * restart: always + healthchecks so the stack recovers on its own
#   * only the Nginx container publishes a port (${HOST_PORT}, default 80)
#   * everything else lives on the internal network `devacademy_network`
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Database: MySQL 8 with a named volume so data survives restarts/reboots.
  # ---------------------------------------------------------------------------
  database:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devacademy}
      MYSQL_USER: ${MYSQL_USER:-devacademy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - devacademy_network

  # ---------------------------------------------------------------------------
  # Backend: Express + TypeScript + TypeORM API.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devacademy-backend:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-devacademy}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-devacademy}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devacademy_network

  # ---------------------------------------------------------------------------
  # Frontend: Next.js (standalone build).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle: relative `/api` goes through Nginx.
        NEXT_PUBLIC_API_URL: /api
    image: devacademy-frontend:latest
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - devacademy_network

  # ---------------------------------------------------------------------------
  # Nginx: the single public entry point (reverse proxy).
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - devacademy_network

volumes:
  mysql_data:
    driver: local

networks:
  devacademy_network:
    driver: bridge
