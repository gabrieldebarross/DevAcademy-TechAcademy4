# =============================================================================
# DevAcademy - ambiente full stack
#
#   nginx   -> ÚNICO serviço exposto ao host (porta ${NGINX_PORT})
#   nginx   -> encaminha "/"      para o frontend (Next.js)
#   nginx   -> encaminha "/api/"  para o backend  (Express + TypeORM)
#   backend -> conecta ao banco MySQL
#
# Tudo roda na rede interna `devacademy_network`; o banco, o backend e o
# frontend nunca publicam portas para o host.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Banco: MySQL com volume nomeado para os dados sobreviverem a reinícios.
  # ---------------------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: devacademy-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devacademy}
      MYSQL_USER: ${MYSQL_USER:-devacademy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devacademy}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root_password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - devacademy_network

  # ---------------------------------------------------------------------------
  # Backend: API em Node.js + TypeScript (Express, TypeORM, JWT).
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devacademy-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-devacademy}
      DB_PASSWORD: ${MYSQL_PASSWORD:-devacademy}
      DB_NAME: ${MYSQL_DATABASE:-devacademy}
      DB_SYNCHRONIZE: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - devacademy_network

  # ---------------------------------------------------------------------------
  # Frontend: aplicação Next.js (App Router + TypeScript + Tailwind).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devacademy-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend
    networks:
      - devacademy_network

  # ---------------------------------------------------------------------------
  # Nginx: proxy reverso e único ponto de entrada da aplicação.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: devacademy-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - devacademy_network

volumes:
  # Volume nomeado -> os dados do MySQL persistem entre reinícios.
  mysql_data:
    driver: local

networks:
  devacademy_network:
    driver: bridge
